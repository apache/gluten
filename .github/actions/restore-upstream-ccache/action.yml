name: Restore ccache from apache/gluten main
description: >-
  Download the ccache stash that apache/infrastructure-actions/stash/save stored
  for `key` on apache/gluten main. stash/restore only searches the repository the
  run belongs to, so a fork run uses this after missing its own stash. Without a
  stash for `key`, the newest stash for the same key prefix is used, as
  actions/cache restore-keys would.
inputs:
  key:
    description: The key the stash was saved with, ending in a hashFiles() hash.
    required: true
  path:
    description: The directory to restore into.
    required: true
outputs:
  hit:
    description: "'true' if a stash was downloaded."
    value: ${{ steps.download.outcome == 'success' }}
runs:
  using: composite
  steps:
    - name: Find the stash
      id: find
      uses: actions/github-script@v9
      env:
        KEY: ${{ inputs.key }}
      with:
        script: |
          const repo = { owner: 'apache', repo: 'gluten' }
          // stash/save appends the branch name to the key. Only stashes saved by
          // apache/gluten's own runs on main count.
          const usable = (a) => !a.expired && a.name.endsWith('-main')
            && a.workflow_run.head_branch == 'main'
            && a.workflow_run.head_repository_id == a.workflow_run.repository_id
          const exact = process.env.KEY + '-main'
          const { data } = await github.rest.actions.listArtifactsForRepo({
            ...repo, name: exact, per_page: 10
          })
          let stash = data.artifacts.find(usable)
          if (!stash) {
            // The key changed in this branch, or main changed it and the cache
            // workflow hasn't saved the new stash yet: take the newest one it saved.
            const prefix = process.env.KEY.replace(/[0-9a-f]{64}$/, '')
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              ...repo, workflow_id: 'velox_backend_cache.yml', branch: 'main',
              status: 'success', per_page: 5
            })
            for (const run of runs.workflow_runs) {
              const { data: arts } = await github.rest.actions.listWorkflowRunArtifacts({
                ...repo, run_id: run.id, per_page: 100
              })
              stash = arts.artifacts.find(a => usable(a) && a.name.startsWith(prefix))
              if (stash) break
            }
          }
          if (stash) {
            console.log('Restoring ' + stash.name + ' from apache/gluten run ' + stash.workflow_run.id)
            core.setOutput('name', stash.name)
            core.setOutput('run_id', stash.workflow_run.id)
          } else {
            console.log('No stash for ' + exact + ' on apache/gluten main')
          }
    - name: Download the stash
      id: download
      if: steps.find.outputs.run_id != ''
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ steps.find.outputs.name }}
        repository: apache/gluten
        run-id: ${{ steps.find.outputs.run_id }}
        github-token: ${{ github.token }}
        path: ${{ inputs.path }}
