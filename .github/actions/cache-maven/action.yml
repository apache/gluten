name: Cache Maven distribution
description: Cache the build/mvn distribution without caching Maven dependencies.
runs:
  using: composite
  steps:
    - name: Read pinned Maven version
      id: maven
      shell: bash
      run: |
        version=$(awk -F '[<>]' '/<maven[.]version>/ { print $3; exit }' pom.xml)
        if [ -z "$version" ]; then
          echo "::error::Could not read maven.version from pom.xml"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Cache Maven distribution
      uses: actions/cache@v4
      with:
        path: build/.mvn
        key: maven-distribution-v1-${{ steps.maven.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
