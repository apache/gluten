name: Check out the merged tree
description: >-
  On a fork push, replace the workspace with the tree that detect-changes in
  velox_backend_x86.yml squash-merged onto apache/gluten main. On any other
  event the caller's actions/checkout already holds the revision to test, and
  this does nothing. Use it right after actions/checkout, which is also what
  brings this file into the workspace.
runs:
  using: composite
  steps:
    - name: Download the merged tree
      if: github.event_name == 'push'
      uses: actions/download-artifact@v8
      with:
        name: merged-tree
        path: ${{ runner.temp }}/merged-tree
    # A tarball rather than a git checkout: some job containers have no git.
    - name: Replace the workspace with the merged tree
      if: github.event_name == 'push'
      shell: bash
      run: |
        shopt -s dotglob nullglob
        rm -rf "$GITHUB_WORKSPACE"/*
        tar -xzf "$RUNNER_TEMP/merged-tree/merged-tree.tar.gz" -C "$GITHUB_WORKSPACE"
        rm -rf "$RUNNER_TEMP/merged-tree"
