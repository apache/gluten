name: Velox Backend (x86)

on:
  pull_request:
    paths:
      - '.github/workflows/velox_backend_x86.yml'
      - '.github/workflows/velox_native_build.yml'
      - 'gluten-ras/**'
      - '.github/workflows/velox_jvm_tests.yml'
      - '.github/workflows/util/jvm-test-build.py'
      - '.github/workflows/util/jvm-test-timings.json'
      - '.github/workflows/util/run-jvm-tests.sh'
      - 'gluten-ut/src-ci/**'
      - 'pom.xml'
      - 'backends-velox/**'
      - 'gluten-uniffle/**'
      - 'gluten-celeborn/**'
      - 'gluten-core/**'
      - 'gluten-substrait/**'
      - 'gluten-arrow/**'
      - 'gluten-delta/**'
      - 'gluten-iceberg/**'
      - 'gluten-hudi/**'
      - 'gluten-paimon/**'
      - 'gluten-ut/**'
      - 'package/**'
      - 'shims/**'
      - 'tools/gluten-it/**'
      - 'ep/build-velox/**'
      - 'cpp/**'
      - 'dev/**'
      - 'build/mvn'
  # Recheck all JVM configurations nightly, and allow manual verification.
  schedule:
    - cron: '0 2 * * *'
  # On-demand full run (e.g. to re-check an extended combo before a release).
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  MVN_CMD: 'build/mvn -ntp'
  WGET_CMD: 'wget -nv'
  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  # spark.sql.ansi.enabled defaults to false.
  SPARK_ANSI_SQL_MODE: false

concurrency:
  group: ${{ github.repository }}-${{ github.event.pull_request.number || github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # Detect which parts of the codebase were modified so downstream jobs can
  # skip work that is irrelevant to the change (e.g. a Spark-3.4-shim-only change does
  # not need to run spark-test-spark35/40/41; C++ changes still run spark-test-*
  # jobs to validate JNI/native integration).
  #
  # Output flags:
  #   cpp      – C++ sources, Velox build scripts, or dev tooling changed
  #   java     – any cross-version Java/Scala/Maven source changed
  #   shims34/35/40/41 – version-specific shim layer changed
  #   tools_it – tools/gluten-it changed
  #
  # A job runs when ANY of the relevant flags is true, so:
  #   • gluten-core change  → java=true  → all spark-test jobs run  ✓
  #   • shims/spark35 only  → shims35=true → only spark35 jobs run  ✓
  #   • pure cpp change     → cpp=true   → all JVM jobs run ✓
  #
  # Scheduled/manual runs have no PR diff, so force every path flag true.
  # Extended TPC matrices now belong to the independent integration workflow.
  detect-changes:
    # Every job chains off this one, so the fork guard here skips the whole
    # workflow: a fork with Actions enabled would otherwise burn ~1800 runner
    # minutes nightly on a signal nobody reads.
    if: github.event_name != 'schedule' || github.repository_owner == 'apache'
    runs-on: ubuntu-22.04
    outputs:
      changes: ${{ toJSON(steps.filter.outputs) }}
      full_run: ${{ steps.filter.outputs.full_run }}
      cpp:      ${{ steps.filter.outputs.cpp }}
      java:     ${{ steps.filter.outputs.java }}
      shims34:  ${{ steps.filter.outputs.shims34 }}
      shims35:  ${{ steps.filter.outputs.shims35 }}
      shims40:  ${{ steps.filter.outputs.shims40 }}
      shims41:  ${{ steps.filter.outputs.shims41 }}
      shims42:  ${{ steps.filter.outputs.shims42 }}
      tools_it: ${{ steps.filter.outputs.tools_it }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate shared test builds
        run: python3 -m unittest discover -s gluten-ut/src-ci/test/python
      - name: Detect changed paths
        id: filter
        run: |
          event="${{ github.event_name }}"
          if [ "$event" = "schedule" ] || [ "$event" = "workflow_dispatch" ]; then
            # schedule / workflow_dispatch: no PR diff to inspect.
            # For scheduled runs, skip entirely when no commits landed in the
            # last 24 hours — avoids burning runner minutes on idle days.
            if [ "$event" = "schedule" ]; then
              recent=$(git log --oneline --after="24 hours ago" HEAD | wc -l)
              if [ "$recent" -eq 0 ]; then
                echo "No commits in the last 24 hours -- skipping nightly run."
                for flag in cpp java shims34 shims35 shims40 shims41 shims42 tools_it; do
                  echo "$flag=false" >> $GITHUB_OUTPUT
                done
                echo "full_run=false" >> $GITHUB_OUTPUT
                exit 0
              fi
            fi
            # Run everything, including the extended matrices PR runs skip.
            for flag in cpp java shims34 shims35 shims40 shims41 shims42 tools_it; do
              echo "$flag=true" >> $GITHUB_OUTPUT
            done
            echo "full_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "full_run=false" >> $GITHUB_OUTPUT
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.sha }}
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "$changed"

          regular_changed=$(echo "$changed" | grep -vE '^(backends-velox/src-iceberg-upstream/|gluten-ut/src-iceberg-upstream/|\.github/workflows/util/iceberg-upstream/|\.github/workflows/iceberg_spark_ut\.yml$)' || true)
          match() { echo "$regular_changed" | grep -qE "$1" && echo true || echo false; }

          echo "cpp=$(match      '^(cpp/|ep/build-velox/|dev/)')"                                            >> $GITHUB_OUTPUT
          echo "java=$(match     '^(\.github/workflows/|pom\.xml|backends-velox/|gluten-(uniffle|celeborn|ras|core|substrait|arrow|delta|iceberg|hudi|paimon)/|gluten-ut/(common/|test/|pom\.xml)|package/|build/mvn)')" >> $GITHUB_OUTPUT
          echo "shims34=$(match  '^(shims/(spark34|common)/|gluten-ut/spark34/)')"                           >> $GITHUB_OUTPUT
          echo "shims35=$(match  '^(shims/(spark35|common)/|gluten-ut/spark35/)')"                           >> $GITHUB_OUTPUT
          echo "shims40=$(match  '^(shims/(spark40|common)/|gluten-ut/spark40/)')"                           >> $GITHUB_OUTPUT
          echo "shims41=$(match  '^(shims/(spark41|common)/|gluten-ut/spark41/)')"                           >> $GITHUB_OUTPUT
          echo "shims42=$(match  '^(shims/(spark42|common)/|gluten-ut/spark42/)')"                           >> $GITHUB_OUTPUT
          echo "tools_it=$(match '^tools/gluten-it/')"                                                       >> $GITHUB_OUTPUT

  build-native-lib-centos-8:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.cpp == 'true' || needs.detect-changes.outputs.java == 'true' ||
      needs.detect-changes.outputs.shims34 == 'true' || needs.detect-changes.outputs.shims35 == 'true' ||
      needs.detect-changes.outputs.shims40 == 'true' || needs.detect-changes.outputs.shims41 == 'true'
    uses: ./.github/workflows/velox_native_build.yml
    with:
      revision: ${{ github.sha }}
      artifact: velox-native-lib-centos-8-${{ github.sha }}
      save-cache: true

  spark-test-spark34:
    needs: [detect-changes, build-native-lib-centos-8]
    if: >-
      needs.detect-changes.outputs.java == 'true' || needs.detect-changes.outputs.shims34 == 'true' || needs.detect-changes.outputs.cpp == 'true'
    uses: ./.github/workflows/velox_jvm_tests.yml
    with:
      configuration: spark34
      shards: '[0, 1, 2]'
      image: apache/gluten:centos-8-jdk17
      native-artifact: velox-native-lib-centos-8-${{ github.sha }}

  spark-test-spark35:
    needs: [detect-changes, build-native-lib-centos-8]
    if: >-
      needs.detect-changes.outputs.java == 'true' || needs.detect-changes.outputs.shims35 == 'true' || needs.detect-changes.outputs.cpp == 'true'
    uses: ./.github/workflows/velox_jvm_tests.yml
    with:
      configuration: spark35
      shards: '[0, 1, 2, 3]'
      image: apache/gluten:centos-8-jdk17
      native-artifact: velox-native-lib-centos-8-${{ github.sha }}

  spark-test-spark35-scala213:
    needs: [detect-changes, build-native-lib-centos-8]
    if: >-
      needs.detect-changes.outputs.java == 'true' || needs.detect-changes.outputs.shims35 == 'true' || needs.detect-changes.outputs.cpp == 'true'
    uses: ./.github/workflows/velox_jvm_tests.yml
    with:
      configuration: spark35-scala213
      shards: '[0, 1]'
      image: apache/gluten:centos-8-jdk17
      native-artifact: velox-native-lib-centos-8-${{ github.sha }}

  spark-test-spark40:
    needs: [detect-changes, build-native-lib-centos-8]
    if: >-
      needs.detect-changes.outputs.java == 'true' || needs.detect-changes.outputs.shims40 == 'true' || needs.detect-changes.outputs.cpp == 'true'
    uses: ./.github/workflows/velox_jvm_tests.yml
    with:
      configuration: spark40
      shards: '[0, 1, 2, 3]'
      image: apache/gluten:centos-8-jdk17
      native-artifact: velox-native-lib-centos-8-${{ github.sha }}

  spark-test-spark40-hive:
    needs: [detect-changes, build-native-lib-centos-8]
    if: >-
      needs.detect-changes.outputs.java == 'true' || needs.detect-changes.outputs.shims40 == 'true' || needs.detect-changes.outputs.cpp == 'true'
    uses: ./.github/workflows/velox_jvm_tests.yml
    with:
      configuration: spark40-hive
      shards: '[0]'
      image: apache/gluten:centos-8-jdk17
      native-artifact: velox-native-lib-centos-8-${{ github.sha }}

  spark-test-spark41:
    needs: [detect-changes, build-native-lib-centos-8]
    if: >-
      needs.detect-changes.outputs.java == 'true' || needs.detect-changes.outputs.shims41 == 'true' || needs.detect-changes.outputs.cpp == 'true'
    uses: ./.github/workflows/velox_jvm_tests.yml
    with:
      configuration: spark41
      shards: '[0, 1, 2]'
      image: apache/gluten:centos-9-jdk17
      native-artifact: velox-native-lib-centos-8-${{ github.sha }}

  spark-test-spark41-slow:
    needs: [detect-changes, build-native-lib-centos-8]
    if: >-
      needs.detect-changes.outputs.java == 'true' || needs.detect-changes.outputs.shims41 == 'true' || needs.detect-changes.outputs.cpp == 'true'
    uses: ./.github/workflows/velox_jvm_tests.yml
    with:
      configuration: spark41-slow
      shards: '[0, 1]'
      image: apache/gluten:centos-9-jdk17
      native-artifact: velox-native-lib-centos-8-${{ github.sha }}
