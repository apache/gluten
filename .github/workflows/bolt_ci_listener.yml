name: Bolt CI Listener

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      head_sha:
        description: Full reviewed commit SHA (required for a new external-fork commit)
        type: string

permissions: {}

env:
  CONTROL_SHA: ${{ github.workflow_sha }}

jobs:
  listen:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: bolt-control-pr-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: write
      checks: write
      pull-requests: write
    outputs:
      pr: ${{ steps.listen.outputs.pr }}
      run_id: ${{ steps.listen.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/workflows/util/bolt-ci
      - id: listen
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/workflows/util/bolt-ci/control.py listen

  watch:
    needs: listen
    if: needs.listen.outputs.run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      evidence: ${{ steps.watch.outputs.evidence }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/workflows/util/bolt-ci
      - id: watch
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ needs.listen.outputs.run_id }}
        run: python3 .github/workflows/util/bolt-ci/control.py watch

  expire:
    needs: [listen, watch]
    if: needs.watch.outputs.evidence != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: bolt-control-pr-${{ needs.listen.outputs.pr }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: write
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/workflows/util/bolt-ci
      - env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ needs.listen.outputs.run_id }}
          QUEUE_EVIDENCE: ${{ needs.watch.outputs.evidence }}
        run: python3 .github/workflows/util/bolt-ci/control.py expire
