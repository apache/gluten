name: Velox Backend (Enhanced)

on:
  pull_request:
    paths:
      - '.github/workflows/velox_backend_enhanced.yml'
      - '.github/workflows/velox_jvm_tests.yml'
      - '.github/workflows/util/jvm-test-build.py'
      - '.github/workflows/util/jvm-test-timings.json'
      - '.github/workflows/util/run-jvm-tests.sh'
      - 'gluten-ut/src-ci/**'
      - 'pom.xml'
      - 'backends-velox/**'
      - 'gluten-uniffle/**'
      - 'gluten-celeborn/**'
      - 'gluten-core/**'
      - 'gluten-substrait/**'
      - 'gluten-arrow/**'
      - 'gluten-delta/**'
      - 'gluten-iceberg/**'
      - 'gluten-hudi/**'
      - 'gluten-ut/**'
      - 'package/**'
      - 'shims/**'
      - 'tools/gluten-it/**'
      - 'ep/build-velox/**'
      - 'cpp/**'
      - 'dev/**'
      - 'build/mvn'

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  MVN_CMD: 'build/mvn -ntp'
  WGET_CMD: 'wget -nv'
  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  # spark.sql.ansi.enabled defaults to false.
  SPARK_ANSI_SQL_MODE: false

concurrency:
  group: ${{ github.repository }}-${{ github.event.pull_request.number || github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # Detect which parts of the codebase were modified so downstream jobs can
  # skip work that is irrelevant to the change.
  detect-changes:
    timeout-minutes: 1
    runs-on: ubuntu-22.04
    outputs:
      cpp:     ${{ steps.filter.outputs.cpp }}
      java:    ${{ steps.filter.outputs.java }}
      shims35: ${{ steps.filter.outputs.shims35 }}
      shims40: ${{ steps.filter.outputs.shims40 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate shared test builds
        run: python3 -m unittest discover -s gluten-ut/src-ci/test/python
      - name: Detect changed paths
        id: filter
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.sha }}
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "$changed"

          regular_changed=$(echo "$changed" | grep -vE '^(backends-velox/src-iceberg-upstream/|gluten-ut/src-iceberg-upstream/|\.github/workflows/util/iceberg-upstream/|\.github/workflows/iceberg_spark_ut\.yml$)' || true)
          match() { echo "$regular_changed" | grep -qE "$1" && echo true || echo false; }

          echo "cpp=$(match     '^(cpp/|ep/build-velox/|dev/)')"                                             >> $GITHUB_OUTPUT
          echo "java=$(match    '^(\.github/workflows/|pom\.xml|backends-velox/|gluten-(uniffle|celeborn|ras|core|substrait|arrow|delta|iceberg|hudi)/|gluten-ut/(common/|test/|pom\.xml)|package/|build/mvn)')" >> $GITHUB_OUTPUT
          echo "shims35=$(match '^(shims/(spark35|common)/|gluten-ut/spark35/)')"                            >> $GITHUB_OUTPUT
          echo "shims40=$(match '^(shims/(spark40|common)/|gluten-ut/spark40/)')"                            >> $GITHUB_OUTPUT

  build-native-lib-centos-8:
    timeout-minutes: 6
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.cpp == 'true' || needs.detect-changes.outputs.java == 'true' ||
      needs.detect-changes.outputs.shims35 == 'true' || needs.detect-changes.outputs.shims40 == 'true'
    runs-on: ubuntu-22.04
    container: apache/gluten:vcpkg-almalinux-8-gcc13
    steps:
      - name: Install CI tools (temporary - until image is rebuilt with gh/jq/bison/python3.9)
        run: |
          dnf install -y jq bison tzdata
          dnf module -y install python39 && alternatives --set python3 /usr/bin/python3.9
          dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
          dnf install -y gh --setopt=gpgcheck=0
      - uses: actions/checkout@v7
      - name: Get Ccache from Apache Stash
        id: ccache-stash
        uses: apache/infrastructure-actions/stash/restore@69afc125e535c4c41e7f1b7470f583087e0f344b
        with:
          path: '${{ env.CCACHE_DIR }}'
          key: ccache-enhanced-almalinux8-release-default-${{ hashFiles('ep/build-velox/src/**') }}
      - name: Get Ccache from actions/cache (fallback on Stash miss)
        if: steps.ccache-stash.outputs.stash-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: '${{ env.CCACHE_DIR }}'
          key: ccache-enhanced-almalinux8-release-default-${{github.sha}}
          restore-keys: |
            ccache-enhanced-almalinux8-release-default
      - name: Build Gluten native libraries
        run: |
          set -e
          yum install tzdata bison -y
          df -a
          export CCACHE_MAXSIZE=1G
          ccache -sz
          bash dev/ci-velox-buildstatic-centos-8-enhanced-features.sh
          ccache -s

      - name: "Save ccache"
        if: always()
        uses: apache/infrastructure-actions/stash/save@0ba14156c9f4c3cfbe4b0c9f36339ab0f8d81e53
        with:
          path: '${{ env.CCACHE_DIR }}'
          key: ccache-enhanced-almalinux8-release-default-${{ hashFiles('ep/build-velox/src/**') }}
          include-hidden-files: true
      - uses: actions/upload-artifact@v7
        with:
          name: velox-native-lib-enhanced-centos-8-${{github.sha}}
          path: ./cpp/build/releases/
          if-no-files-found: error


  spark-test-spark35:
    needs: [detect-changes, build-native-lib-centos-8]
    if: >-
      needs.detect-changes.outputs.java == 'true' || needs.detect-changes.outputs.shims35 == 'true' || needs.detect-changes.outputs.cpp == 'true'
    uses: ./.github/workflows/velox_jvm_tests.yml
    with:
      configuration: enhanced-spark35
      shards: '[0]'
      image: apache/gluten:centos-8-jdk17
      native-artifact: velox-native-lib-enhanced-centos-8-${{ github.sha }}

  spark-test-spark35-slow:
    needs: [detect-changes, build-native-lib-centos-8]
    if: >-
      needs.detect-changes.outputs.java == 'true' || needs.detect-changes.outputs.shims35 == 'true' || needs.detect-changes.outputs.cpp == 'true'
    uses: ./.github/workflows/velox_jvm_tests.yml
    with:
      configuration: enhanced-spark35-slow
      shards: '[0, 1]'
      image: apache/gluten:centos-8-jdk17
      native-artifact: velox-native-lib-enhanced-centos-8-${{ github.sha }}

  spark-test-spark40:
    needs: [detect-changes, build-native-lib-centos-8]
    if: >-
      needs.detect-changes.outputs.java == 'true' || needs.detect-changes.outputs.shims40 == 'true' || needs.detect-changes.outputs.cpp == 'true'
    uses: ./.github/workflows/velox_jvm_tests.yml
    with:
      configuration: enhanced-spark40
      shards: '[0, 1, 2]'
      image: apache/gluten:centos-8-jdk17
      native-artifact: velox-native-lib-enhanced-centos-8-${{ github.sha }}
