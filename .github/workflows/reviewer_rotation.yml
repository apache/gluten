name: Reviewer Rotation

on:
  pull_request_target:
    types:
      - opened
      - ready_for_review
      - reopened
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to assign reviewers to for manual runs."
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  request-reviewers:
    name: Request reviewers
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    concurrency:
      group: reviewer-rotation-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Checkout base repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Request reviewers
        uses: actions/github-script@v7
        env:
          CONFIG_PATH: .github/reviewer_rotation.json
          PR_NUMBER: ${{ github.event.inputs.pr_number || '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const script = require(`${process.env.GITHUB_WORKSPACE}/.github/workflows/dev_cron/request_reviewers.js`);
            await script({ github, context, core });
