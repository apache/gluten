# A pull request from a fork runs velox_backend_x86.yml, velox_backend_arm.yml and
# velox_kafka.yml in the fork, on push. apache/infrastructure-actions/fork-ci reports
# those runs as checks on the pull request. It only reads API metadata, so it never
# runs pull request code. fork_ci_signal.yml triggers it when a pull request changes;
# the schedule catches runs that finish later.
name: Fork CI status

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Fork CI signal]
    types: [completed]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  checks: write
  pull-requests: read

concurrency:
  group: fork-ci-status
  cancel-in-progress: false

jobs:
  bridge:
    if: github.repository == 'apache/gluten'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: apache/infrastructure-actions/fork-ci@36e391618baf31f50c5a7a7347faf00cba6cf085 # fork-ci/v1.0.0
        with:
          workflow: velox_backend_x86.yml
          check-name: Velox Backend (x86) in fork
          guide-url: https://github.com/apache/gluten/blob/main/CONTRIBUTING.md#velox-backend-ci
      - uses: apache/infrastructure-actions/fork-ci@36e391618baf31f50c5a7a7347faf00cba6cf085 # fork-ci/v1.0.0
        if: ${{ !cancelled() }}
        with:
          workflow: velox_backend_arm.yml
          check-name: Velox Backend (ARM) in fork
          guide-url: https://github.com/apache/gluten/blob/main/CONTRIBUTING.md#velox-backend-ci
      - uses: apache/infrastructure-actions/fork-ci@36e391618baf31f50c5a7a7347faf00cba6cf085 # fork-ci/v1.0.0
        if: ${{ !cancelled() }}
        with:
          workflow: velox_kafka.yml
          check-name: Velox Kafka in fork
          guide-url: https://github.com/apache/gluten/blob/main/CONTRIBUTING.md#velox-backend-ci
