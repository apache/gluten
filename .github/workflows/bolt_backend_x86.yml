name: Bolt Backend (x86)

on:
  pull_request:
    paths:
      - '.github/workflows/bolt_backend_x86.yml'
      - 'dev/docker/Dockerfile.ubuntu22-bolt'
      - 'pom.xml'
      - 'backends-bolt/**'
      - 'gluten-celeborn/**'
      - 'gluten-core/**'
      - 'gluten-substrait/**'
      - 'gluten-arrow/**'
      - 'gluten-iceberg/**'
      - 'gluten-ut/**'
      - 'package/**'
      - 'shims/**'
      - 'cpp/core/**'
      - 'cpp/bolt/**'
      - 'dev/**'
      - 'build/mvn'
      - 'Makefile'

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  BOLT_IMAGE: 'taiyangli/gluten:ubuntu22-bolt'

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  bolt-build-and-test-spark35:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Pull Bolt CI docker image
        run: |
          docker pull $BOLT_IMAGE

      # Cache Conan's home, including package binaries, recipes and metadata. On a hit,
      # `conan install --build=missing` reuses the prebuilt packages instead of
      # recompiling heavy deps (llvm-core/folly/arrow) from source. The key is
      # keyed on the Conan recipe/patch files so it invalidates when deps change.
      - name: Cache Conan home
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.conan2
          key: conan-bolt-${{ hashFiles('cpp/conanfile.py', 'ep/bolt/conanfile.py', 'ep/bolt/scripts/conan/**') }}
          restore-keys: |
            conan-bolt-

      - name: Build Bolt native libraries and run cpp tests
        run: |
          mkdir -p $GITHUB_WORKSPACE/.conan2
          docker run --security-opt seccomp=unconfined -v $GITHUB_WORKSPACE:/work -w /work \
            -v $GITHUB_WORKSPACE/.conan2:/root/.conan2 \
            $BOLT_IMAGE bash -c "
            set -e
            export JAVA_HOME=/usr/lib/jvm/java-17-openjdk
            export PATH=\$JAVA_HOME/bin:\$PATH
            java -version
            conan profile detect --exist-ok
            make bolt-recipe
            make release
          "
          # TODO: Building native with tests and running ctest from scratch is
          # very slow on a clean runner and may exceed the 6h job limit. Re-enable
          # once the pre-built Bolt CI image has the required test dependencies.
          # docker run -v $GITHUB_WORKSPACE:/work -w /work $BOLT_IMAGE bash -c "
          #   set -e
          #   export JAVA_HOME=/usr/lib/jvm/java-17-openjdk
          #   export PATH=\$JAVA_HOME/bin:\$PATH
          #   make cpp-test-release
          # "

      - name: Build and run unit tests for Spark 3.5
        run: |
          docker run --security-opt seccomp=unconfined -e SPARK_TESTING=true -v $GITHUB_WORKSPACE:/work -w /work $BOLT_IMAGE bash -c "
            set -e
            export JAVA_HOME=/usr/lib/jvm/java-17-openjdk
            export PATH=\$JAVA_HOME/bin:\$PATH
            export SPARK_SCALA_VERSION=2.12
            java -version
            build/mvn -ntp clean test -Pbackends-bolt -Pspark-3.5 -Phadoop-3.2 -Pceleborn -Piceberg -Pspark-ut \
              -DargLine=\"-Dspark.test.home=/opt/shims/spark35/spark_home/\" \
              -DtagsToExclude=org.apache.spark.tags.ExtendedSQLTest,org.apache.spark.tags.SlowHiveTest,org.apache.gluten.tags.UDFTest,org.apache.gluten.tags.EnhancedFeaturesTest,org.apache.gluten.tags.SkipTest \
              -Denforcer.skip=true -DfailIfNoTests=false -Dexec.skip \
              -Dmaven.test.failure.ignore=true
          "

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}-report
          path: '**/surefire-reports/TEST-*.xml'

      - name: Upload unit tests log files
        if: ${{ !success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}-test-log
          path: |
            **/target/*.log
            **/gluten-ut/**/hs_err_*.log
            **/gluten-ut/**/core.*
