name: Report test results
on:
  workflow_run:
    workflows: ["Velox Backend (x86)"]
    types:
      - completed

permissions: {}

jobs:
  test_report:
    if: github.event.workflow_run.conclusion != 'skipped' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
    steps:
    # The reports are test output, not code: they are parsed, never run.
    - name: Download test results to report
      uses: actions/download-artifact@v8
      with:
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}
        pattern: '*-report'
    - name: Publish test report
      uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
      with:
        check_name: Report test results
        report_paths: '**/surefire-reports/TEST-*.xml'
        commit: ${{ github.event.workflow_run.head_sha }}
        job_summary: false
