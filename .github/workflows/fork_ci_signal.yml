# Gives fork_ci_status.yml an upstream event when a pull request changes. It does
# nothing itself; the status workflow reads the pull request through the API.
name: Fork CI signal

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
    branches:
      # Keep in sync with the base branches fork_ci_status.yml reports on (main).
      - main

permissions: {}

jobs:
  signal:
    if: github.repository == 'apache/gluten'
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - run: echo 'fork_ci_status.yml reads this pull request through the GitHub API.'
