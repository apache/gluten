# Runs Apache Iceberg's OWN `spark` + `spark-extensions` unit tests against
# Gluten/Velox built from the source in this repository. The pipeline:
#
#   1. Builds the Velox/Gluten native libraries (centos-7 + vcpkg, x86_64).
#   2. Per (Spark version x shard): builds `backends-velox` and its dependencies
#      with -Piceberg -Piceberg-test, then runs the upstream Iceberg test
#      classes for that shard and gates the results against a committed
#      known-failures baseline.
#   3. Merges the per-shard results into a refreshed, ready-to-commit baseline.
#
# Unlike the Delta pipeline (which clones delta-io/delta and runs its sbt build),
# this one needs NO upstream clone and NO Gluten bundle jar. Iceberg publishes
# every Spark test class in its `-tests.jar` artifacts, and Gluten's existing
# `-Piceberg` profile already declares them, so the tests are driven straight out
# of the Maven dependency graph:
#
#   * `-DdependenciesToScan=org.apache.iceberg:iceberg-spark-<v>_<s>,...` makes
#     surefire discover test classes inside those jars (not just in
#     `src/test/java`), so we run the WHOLE upstream suite -- ~195 test classes
#     per Spark version -- rather than the hand-picked subset that
#     `backends-velox/src-iceberg-spark34/` vendors for the Spark-3.4 job in
#     velox_backend_x86.yml.
#   * Gluten is enabled WITHOUT patching a single upstream source file: no
#     Iceberg test sets `spark.plugins`, and `SparkConf` picks up every `spark.*`
#     JVM system property, so passing the Gluten conf via surefire's argLine
#     enables Gluten in every SparkSession those tests build -- including the ~25
#     classes that build their own session instead of using `TestBase`.
#
# Limited to Velox + x86 to keep the matrix simple, per the pipeline's purpose of
# validating Gluten changes against released Iceberg.

name: Iceberg Spark UT (Gluten)

on:
  # Self-contained: this workflow owns the whole Iceberg pipeline, including its
  # own native build, and is NOT called by velox_backend_x86.yml -- so a change
  # confined to this pipeline's files does not drag in that workflow's ~50-job
  # TPC-H/DS + Spark-UT matrix, and a Velox/core change does not carry this
  # suite.
  #
  # Note the tradeoff: `gluten-iceberg/**` and `backends-velox/src-iceberg*/**`
  # also match velox_backend_x86.yml's filter (its spark-ut jobs build with
  # -Piceberg), so a change there runs BOTH workflows and pays for the centos-7
  # native build twice (~10 min). That is the price of decoupling, and it is
  # small next to the case above.
  #
  # The `paths:` filter below IS the per-PR gate -- GitHub evaluates it before
  # the run is created, so a non-Iceberg PR costs nothing at all. Changes to
  # general Velox/core/native code can also affect Iceberg offload, but they are
  # touched on most PRs; the nightly `schedule` run below is the safety net for
  # those, and `workflow_dispatch` lets anyone run the suite against a branch on
  # demand.
  pull_request:
    paths:
      - '.github/workflows/iceberg_spark_ut.yml'
      - '.github/workflows/util/iceberg-spark-ut/**'
      # The known-failures gate is shared with the Delta pipeline; a change to it
      # changes this pipeline's verdict, so run the suite for it too.
      - '.github/workflows/util/delta-spark-ut/compare-test-results.py'
      # Velox revision updates can change Iceberg offload behavior.
      - 'ep/build-velox/src/get-velox.sh'
      - 'gluten-iceberg/**'
      # Covers src-iceberg, src-iceberg10 and any future variant.
      - 'backends-velox/src-iceberg*/**'
      # Negated patterns are evaluated in order and override the positives
      # above, so this must stay last.
      - '!.github/workflows/util/iceberg-spark-ut/**/*.md'
  # Force a run skipped by `paths:` without requiring label permissions.
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      spark_versions:
        description: 'Which Spark target(s) to run: all | 3.4 | 3.5 | 4.0'
        required: true
        default: 'all'
        type: choice
        options: ['all', '3.4', '3.5', '4.0']
      fork_count:
        description: 'Forked test JVMs per shard (surefire forkCount)'
        required: true
        default: '2'
      update_baseline:
        description: 'Seed/refresh the known-failures baseline instead of enforcing it'
        type: boolean
        required: false
        default: false
      fail_on_fixed:
        description: 'Fail when a baseline test now passes (keeps the baseline honest)'
        type: boolean
        required: false
        default: true
  # Nightly full run against the latest default branch. Per-PR the `paths:`
  # filter above runs the suite only for Iceberg-relevant changes, to save GHA
  # minutes; this scheduled run keeps full coverage once a day so regressions
  # from general Velox/core changes are still caught, and it enforces
  # `fail_on_fixed` so the baseline stays honest. Offset from the Delta
  # pipeline's 05:00 so the two do not contend for runners.
  schedule:
    - cron: '0 7 * * *'

# Comment runs execute PR code; keep the token read-only. Stash needs artifacts access.
permissions:
  contents: read
  actions: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  MVN_CMD: 'build/mvn -ntp'
  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  # `issue_comment` runs on the default branch, so explicitly select the PR merge ref.
  ICEBERG_CHECKOUT_REF: ${{ github.event.issue.number && format('refs/pull/{0}/merge', github.event.issue.number) || '' }}
  # Number of shards per Spark target. Must equal the length of the `shard`
  # matrix below.
  #
  # Sharding is by TEST CLASS and the total work is fixed, so this trades runner
  # count for wall clock: every shard pays the same fixed setup (build
  # backends-velox and its dependencies, ~5 min) and then runs its ~1/6 of the
  # ~195 upstream test classes. 6 shards x 3 Spark targets = 18 test jobs.
  #
  # Memory is per runner and therefore unaffected: each shard is its own job, so
  # it is ICEBERG_FORK_COUNT forked JVMs against the ~16G limit, at ~4G per fork
  # (2G heap + 2G off-heap) -- see run-iceberg-tests.sh.
  ICEBERG_NUM_SHARDS: '6'
  # Forked test JVMs per shard (surefire forkCount). Each upstream Iceberg test
  # class starts its own Hive metastore + local Spark, so a fork is expensive;
  # 2 keeps the runner within its memory budget (see above).
  ICEBERG_FORK_COUNT: ${{ inputs.fork_count || '2' }}

# Cancel older `pull_request` and `/iceberg-test` runs for the same PR.
#
# `issue_comment` fires on every comment posted on an issue or a PR, and
# `github.event.issue.number` is that issue's number, which for a comment on a
# PR is the PR's own number. Such a run would therefore join the PR's group and
# cancel an in-flight suite while `iceberg-test-requested` below skips it,
# losing the suite and replacing it with nothing. Give only that case a group of
# its own, so every other trigger keeps the exact group name it has today. The
# negated condition is that job's `if` verbatim.
concurrency:
  group: >-
    ${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || github.head_ref || github.sha }}-${{ github.workflow }}${{
      !(github.event_name != 'issue_comment' ||
        (github.event.issue.pull_request &&
         (github.event.comment.body == '/iceberg-test' ||
          startsWith(github.event.comment.body, '/iceberg-test ') ||
          startsWith(github.event.comment.body, format('/iceberg-test{0}', fromJSON('"\r"'))) ||
          startsWith(github.event.comment.body, format('/iceberg-test{0}', fromJSON('"\n"'))))))
      && format('-comment-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  iceberg-test-requested:
    # Match `/iceberg-test` as the first token; pass other event types through.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == '/iceberg-test' ||
        startsWith(github.event.comment.body, '/iceberg-test ') ||
        startsWith(github.event.comment.body, format('/iceberg-test{0}', fromJSON('"\r"'))) ||
        startsWith(github.event.comment.body, format('/iceberg-test{0}', fromJSON('"\n"')))))
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: write
    outputs:
      # JSON array of Spark targets, cross-producted with `shard` by the test job
      # and used on its own by the aggregate job (one baseline per target).
      spark_targets: ${{ steps.targets.outputs.spark_targets }}
    steps:
      - name: Acknowledge the request
        if: ${{ github.event_name == 'issue_comment' }}
        # The informational comment must not block the run.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          TRIGGER_USER: ${{ github.event.comment.user.login }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body \
            "🔄 Iceberg Spark UT started by @${TRIGGER_USER}. [View run](${RUN_URL})"

      - name: Resolve Spark targets
        id: targets
        # Each target pairs the Gluten Spark/Scala profiles with the Iceberg
        # module they must be tested against: Iceberg publishes
        # `iceberg-spark-3.4_2.12`, `iceberg-spark-3.5_2.12` and
        # `iceberg-spark-4.0_2.13` (its v4.0 module is Scala-2.13 only), which is
        # exactly what Gluten's -Pspark-3.4 / -Pspark-3.5 / -Pspark-4.0 profiles
        # resolve. `workflow_dispatch` can narrow this to one target -- useful
        # when (re)seeding a single baseline; every other event runs all three.
        env:
          SPARK_VERSIONS: ${{ inputs.spark_versions || 'all' }}
        run: |
          set -euo pipefail
          case "${SPARK_VERSIONS}" in
            3.4) targets='[{"spark":"3.4","scala":"2.12"}]' ;;
            3.5) targets='[{"spark":"3.5","scala":"2.12"}]' ;;
            4.0) targets='[{"spark":"4.0","scala":"2.13"}]' ;;
            all) targets='[{"spark":"3.4","scala":"2.12"},{"spark":"3.5","scala":"2.12"},{"spark":"4.0","scala":"2.13"}]' ;;
            *) echo "unsupported spark_versions: ${SPARK_VERSIONS}" >&2; exit 1 ;;
          esac
          echo "spark_targets=${targets}" | tee -a "$GITHUB_OUTPUT"

  build-native-lib-centos-7:
    needs: iceberg-test-requested
    # This workflow always builds its own native lib -- there is no caller to
    # provide one, and the `paths:` filter already decided whether the run
    # happens. The ccache key is deliberately IDENTICAL to the Delta pipeline's:
    # it is the same build of the same sources, so the two pipelines warm one
    # another's cache instead of maintaining two copies.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.ICEBERG_CHECKOUT_REF }}
      - name: Get Ccache from Apache Stash
        uses: apache/infrastructure-actions/stash/restore@69afc125e535c4c41e7f1b7470f583087e0f344b
        with:
          path: '${{ env.CCACHE_DIR }}'
          key: ccache-centos7-release-default-${{ hashFiles('ep/build-velox/src/**') }}
      - name: Build Gluten native libraries
        run: |
          docker run -v $GITHUB_WORKSPACE:/work -w /work apache/gluten:vcpkg-centos-7-gcc13 bash -c "
            set -e
            yum install tzdata -y
            df -a
            cd /work
            export CCACHE_DIR=/work/.ccache
            export CCACHE_MAXSIZE=1G
            mkdir -p /work/.ccache
            ccache -sz
            bash dev/ci-velox-buildstatic-centos-7.sh
            ccache -s
          "
      - name: Save Ccache to Apache Stash
        # Comment runs use main's Stash scope; never overwrite it with PR output.
        if: ${{ always() && github.event_name != 'issue_comment' }}
        uses: apache/infrastructure-actions/stash/save@0ba14156c9f4c3cfbe4b0c9f36339ab0f8d81e53
        with:
          path: '${{ env.CCACHE_DIR }}'
          key: ccache-centos7-release-default-${{ hashFiles('ep/build-velox/src/**') }}
          include-hidden-files: true
      - uses: actions/upload-artifact@v7
        with:
          name: iceberg-spark-ut-native-lib-centos-7-${{github.sha}}
          path: ./cpp/build/
          if-no-files-found: error

  iceberg-spark-test:
    needs: [iceberg-test-requested, build-native-lib-centos-7]
    runs-on: ubuntu-22.04
    # centos-9, not centos-8: the Apache Stash actions below run their helpers
    # with the container's `python3`, and use `subprocess.run(capture_output=)`,
    # which needs Python >= 3.7. centos-8's python3 is 3.6.8, on which the
    # action dies with `TypeError: __init__() got an unexpected keyword argument
    # 'capture_output'` -- before it can even report a cache miss. centos-9
    # ships Python 3.9 and is the image the Delta pipeline uses with these same
    # actions.
    container: apache/gluten:centos-9-jdk17
    # 300-min safety cap; a shard is expected to finish well under this.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.iceberg-test-requested.outputs.spark_targets) }}
        # Length of this list MUST equal env.ICEBERG_NUM_SHARDS.
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.ICEBERG_CHECKOUT_REF }}

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          name: iceberg-spark-ut-native-lib-centos-7-${{ github.sha }}
          path: ./cpp/build/

      - name: Resolve workflow inputs
        id: resolve
        # Surface the inputs as step outputs. `workflow_dispatch` supplies them
        # (with defaults); the `pull_request` and nightly `schedule` events
        # supply NONE, so fall back to the same defaults here. The boolean inputs
        # are rendered as explicit 'true'/'false' strings (never empty) via the
        # `&&/||` form so those runs resolve cleanly: update_baseline=false
        # (enforce) and fail_on_fixed=true (so a now-passing baseline test turns
        # the nightly red -- our signal that the committed baseline needs
        # refreshing).
        env:
          UPDATE_BASELINE: ${{ github.event_name == 'workflow_dispatch' && (inputs.update_baseline && 'true' || 'false') || 'false' }}
          # Defaults to true for pull_request and schedule: `inputs` only exists
          # on workflow_dispatch, so a bare `inputs.fail_on_fixed` would silently
          # resolve to false on those events and stop the now-passing check from
          # being enforced.
          FAIL_ON_FIXED: ${{ github.event_name == 'workflow_dispatch' && (inputs.fail_on_fixed && 'true' || 'false') || 'true' }}
        run: |
          set -euo pipefail
          {
            echo "update_baseline=${UPDATE_BASELINE}"
            echo "fail_on_fixed=${FAIL_ON_FIXED}"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Install minimal tools and Stash restore dependencies
        run: |
          set -euo pipefail
          # The image ships git/tar/curl; add JDK 17 (the -Pjava-17 build and the
          # Iceberg v4.0 module require it), python3 (3.9 here -- used by both
          # the known-failures gate and the Apache Stash actions' own helpers),
          # and the gh/jq pair those actions shell out to.
          yum install -y java-17-openjdk-devel python3 which findutils
          case "$(uname -m)" in
            x86_64) ARCH=amd64 ;;
            aarch64) ARCH=arm64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/cli/cli/releases/download/v2.63.2/gh_2.63.2_linux_${ARCH}.tar.gz" \
            | tar -xz -C /usr/local --strip-components=1 "gh_2.63.2_linux_${ARCH}/bin/gh"
          curl -fsSL -o /usr/local/bin/jq "https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-${ARCH}"
          chmod +x /usr/local/bin/jq
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk
          export PATH=$JAVA_HOME/bin:$PATH
          java -version
          python3 --version
          gh --version
          jq --version

      - name: Get Maven repository from Apache Stash
        # The Maven repository stash is a pure download optimization: with a
        # cold, missing or broken stash the build just re-resolves from Maven
        # Central. So it must never be able to fail the suite -- neither on a
        # miss (the first run of a new key, or after a pom.xml change) nor on an
        # infra/action error. `continue-on-error` keeps the shard running in all
        # of those cases.
        continue-on-error: true
        uses: apache/infrastructure-actions/stash/restore@69afc125e535c4c41e7f1b7470f583087e0f344b
        with:
          # Maven's real local repository in this container, and NOT
          # `$HOME/.m2`: GitHub sets HOME=/github/home for a container job, but
          # the JVM takes `user.home` from the passwd entry, so Maven (running
          # as root) uses /root/.m2. run-iceberg-tests.sh asks Maven for this
          # path rather than repeating the assumption.
          path: /root/.m2/repository
          key: m2-iceberg-spark-ut-${{ matrix.target.spark }}-${{ matrix.target.scala }}-${{ hashFiles('pom.xml', '**/pom.xml') }}

      - name: Run upstream Iceberg tests (Spark ${{ matrix.target.spark }}, shard ${{ matrix.shard }} / ${{ env.ICEBERG_NUM_SHARDS }})
        env:
          SPARK_VERSION: ${{ matrix.target.spark }}
          SCALA_VERSION: ${{ matrix.target.scala }}
          SHARD_ID: ${{ matrix.shard }}
          NUM_SHARDS: ${{ env.ICEBERG_NUM_SHARDS }}
          FORK_COUNT: ${{ env.ICEBERG_FORK_COUNT }}
          UPDATE_BASELINE: ${{ steps.resolve.outputs.update_baseline }}
          FAIL_ON_FIXED: ${{ steps.resolve.outputs.fail_on_fixed }}
        run: |
          set -euo pipefail
          # Builds backends-velox, runs this shard's slice of the upstream
          # Iceberg test classes under Gluten, then gates against the baseline.
          # See util/iceberg-spark-ut/run-iceberg-tests.sh.
          bash "$GITHUB_WORKSPACE/.github/workflows/util/iceberg-spark-ut/run-iceberg-tests.sh"

      - name: Save Maven repository to Apache Stash
        # All shards of a target have the same dependencies; one writer avoids
        # matrix jobs overwriting the same stash artifact. Non-fatal for the
        # same reason as the restore above: the tests have already run and been
        # gated by this point, so a failed cache upload must not turn a
        # meaningful result red.
        continue-on-error: true
        if: ${{ success() && matrix.shard == 0 && github.event_name != 'issue_comment' }}
        uses: apache/infrastructure-actions/stash/save@0ba14156c9f4c3cfbe4b0c9f36339ab0f8d81e53
        with:
          path: /root/.m2/repository
          key: m2-iceberg-spark-ut-${{ matrix.target.spark }}-${{ matrix.target.scala }}-${{ hashFiles('pom.xml', '**/pom.xml') }}
          include-hidden-files: true

      - name: Upload per-shard gate lists
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iceberg-spark-ut-gate-lists-${{ matrix.target.spark }}-shard-${{ matrix.shard }}
          path: gate-out/*.txt
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iceberg-spark-ut-reports-${{ matrix.target.spark }}-shard-${{ matrix.shard }}
          # The whole directory: the JUnit XML the gate reads, plus surefire's
          # per-class `*.txt` dumps, which carry the stdout/stderr of a fork that
          # died before it could report.
          path: |
            backends-velox/target/surefire-reports/**
            shard-classes.txt
          if-no-files-found: warn

      - name: Upload JVM crash logs and other failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: iceberg-spark-ut-failure-logs-${{ matrix.target.spark }}-shard-${{ matrix.shard }}
          path: |
            backends-velox/target/*.log
            backends-velox/hs_err_pid*.log
            backends-velox/core.*
            /tmp/*.hprof
          if-no-files-found: ignore

  # Merges every shard's failure/ran lists for one Spark target into a single,
  # sorted, ready-to-commit known-failures file and reports global regressions /
  # now-passing / stale entries. Runs even when some shards went red so the
  # refreshed baseline artifact is always available -- this is what you download
  # and commit to bootstrap or refresh the baseline (see
  # util/iceberg-spark-ut/README.md).
  iceberg-spark-aggregate:
    needs: [iceberg-test-requested, iceberg-spark-test]
    # Runs even when shards go red -- a partially-failing run still produces a
    # useful refreshed baseline. Deliberately NOT `always()`: that also evaluates
    # true while a run is being cancelled, and with `cancel-in-progress` above a
    # superseded push would cancel the shards but still start this job, which
    # then fails hard (by design) on finding no per-shard gate lists.
    # `!cancelled()` drops that case, and the `!= 'skipped'` check drops the
    # other one -- shards skipped because the native build failed -- so a single
    # upstream failure doesn't surface as a second, misleading red job.
    if: ${{ !cancelled() && needs.iceberg-spark-test.result != 'skipped' }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.iceberg-test-requested.outputs.spark_targets) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.ICEBERG_CHECKOUT_REF }}
      - name: Download per-shard gate lists
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: iceberg-spark-ut-gate-lists-${{ matrix.target.spark }}-shard-*
          path: gate-lists
          merge-multiple: true
      - name: Aggregate known failures
        run: |
          set -euo pipefail
          # The gate script is shared with the Delta pipeline (it is engine
          # agnostic: it consumes JUnit XML and suite#test lists).
          python3 .github/workflows/util/delta-spark-ut/compare-test-results.py \
            --mode aggregate \
            --inputs-dir gate-lists \
            --expected-shards "${{ env.ICEBERG_NUM_SHARDS }}" \
            --known-failures ".github/workflows/util/iceberg-spark-ut/known-failures-spark-${{ matrix.target.spark }}.txt" \
            --flaky-tests .github/workflows/util/iceberg-spark-ut/flaky-tests.txt \
            --baseline-out "aggregated/known-failures-spark-${{ matrix.target.spark }}.txt"
      - name: Upload refreshed baseline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iceberg-spark-ut-known-failures-${{ matrix.target.spark }}
          path: aggregated/known-failures-spark-${{ matrix.target.spark }}.txt
          if-no-files-found: warn
