name: Iceberg Spark UT (Gluten)

on:
  pull_request:
    paths:
      - '.github/workflows/iceberg_spark_ut.yml'
      - '.github/workflows/util/iceberg-upstream/**'
      - 'pom.xml'
      - 'backends-velox/**'
      - 'gluten-core/**'
      - 'gluten-substrait/**'
      - 'gluten-arrow/**'
      - 'gluten-ras/**'
      - 'gluten-iceberg/**'
      - 'gluten-ut/src-iceberg-upstream/**'
      - 'shims/**'
      - 'cpp/**'
      - 'ep/build-velox/**'
      - 'dev/**'
      - 'build/mvn'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  MVN_CMD: 'build/mvn -ntp'
  CCACHE_DIR: '${{ github.workspace }}/.ccache'
  SPARK_ANSI_SQL_MODE: false
  ICEBERG_SHARD_COUNT: '12'

# Critical-path execution budget: preparation 1 + native build 8 + tests 29 + gate 2 = 40 minutes.
# Base/head and every shard run independently; no dependency on the Velox CI.
jobs:
  prepare:
    if: github.event_name != 'schedule' || github.repository_owner == 'apache'
    runs-on: ubuntu-22.04
    timeout-minutes: 1
    outputs:
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      shards: ${{ steps.prepare.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: prepare
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "base_sha=${BASE_SHA:-$(git rev-parse HEAD^)}" >> "$GITHUB_OUTPUT"
          python3 -c 'import json, os; print("shards=" + json.dumps(list(range(int(os.environ["ICEBERG_SHARD_COUNT"])))))' >> "$GITHUB_OUTPUT"
          python3 -m unittest discover -s gluten-ut/src-iceberg-upstream/test/python

  native:
    needs: prepare
    runs-on: ubuntu-22.04
    container: apache/gluten:vcpkg-almalinux-8-gcc13
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        revision: [base, head]
    steps:
      - name: Install native build tools
        run: |
          dnf install -y jq bison tzdata
          dnf module -y install python39 && alternatives --set python3 /usr/bin/python3.9
          dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
          dnf install -y gh --setopt=gpgcheck=0
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.revision == 'base' && needs.prepare.outputs.base_sha || github.sha }}
      - name: Restore native build cache
        id: stash
        uses: apache/infrastructure-actions/stash/restore@69afc125e535c4c41e7f1b7470f583087e0f344b
        with:
          path: '${{ env.CCACHE_DIR }}'
          key: ccache-almalinux8-release-default-${{ hashFiles('ep/build-velox/src/**') }}
      - name: Restore fallback native build cache
        if: steps.stash.outputs.stash-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: '${{ env.CCACHE_DIR }}'
          key: ccache-almalinux8-release-default-${{ github.sha }}
          restore-keys: ccache-almalinux8-release-default
      - name: Build native libraries
        run: bash dev/ci-velox-buildstatic-centos-8.sh
      - uses: actions/upload-artifact@v7
        with:
          name: iceberg-native-${{ matrix.revision }}
          path: cpp/build/releases/
          if-no-files-found: error
          retention-days: 1

  iceberg-upstream-test:
    name: iceberg-upstream-test (3.5, ${{ matrix.revision }}, ${{ matrix.shard }})
    needs: [prepare, native]
    runs-on: ubuntu-22.04
    container: apache/gluten:centos-9-jdk17
    timeout-minutes: 29
    strategy:
      fail-fast: false
      matrix:
        revision: [base, head]
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk
      ICEBERG_PROFILES: -Pbackends-velox,iceberg,iceberg-upstream-test,hadoop-3.4,java-17,spark-3.5,scala-2.12
      ICEBERG_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
      ICEBERG_REVISION: ${{ matrix.revision }}
      ICEBERG_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare test checkout
        id: checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$ICEBERG_REVISION" = base ]; then
            directory="$RUNNER_TEMP/iceberg-base"
            git fetch --no-tags --depth=1 origin "$ICEBERG_BASE_SHA"
            git worktree add --detach "$directory" "$ICEBERG_BASE_SHA"
            git config --global --add safe.directory "$directory"
            python3 .github/workflows/util/iceberg-upstream/prepare-base.py "$GITHUB_WORKSPACE" "$directory"
          else
            directory="$GITHUB_WORKSPACE"
          fi
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          mkdir -p iceberg-reports
          python3 -c 'import json, os; print(json.dumps({"index": int(os.environ["ICEBERG_SHARD"]), "count": int(os.environ["ICEBERG_SHARD_COUNT"])}))' > iceberg-reports/shard.json
      - name: Download native libraries
        uses: actions/download-artifact@v8
        with:
          name: iceberg-native-${{ matrix.revision }}
          path: ${{ steps.checkout.outputs.directory }}/cpp/build/releases/
      - name: Build Gluten
        working-directory: ${{ steps.checkout.outputs.directory }}
        run: $MVN_CMD clean install -pl backends-velox -am $ICEBERG_PROFILES -Pfast-build -DskipTests
      - name: Check Iceberg scope and execution classification
        if: matrix.shard == 0
        working-directory: ${{ steps.checkout.outputs.directory }}
        run: $MVN_CMD surefire:test@iceberg-upstream -pl backends-velox $ICEBERG_PROFILES '-Dtest=org.apache.gluten.integration.*Test'
      - name: Run upstream Iceberg query and write tests
        working-directory: ${{ steps.checkout.outputs.directory }}
        # Each parameterized method belongs to one shard. Keep one Spark fork per runner.
        run: >-
          $MVN_CMD surefire:test@iceberg-upstream -pl backends-velox $ICEBERG_PROFILES
          -Diceberg.upstream.shard="$ICEBERG_SHARD" -Diceberg.upstream.shards="$ICEBERG_SHARD_COUNT"
          -Dmaven.test.failure.ignore=true -Diceberg.upstream.reports="$GITHUB_WORKSPACE/iceberg-reports"
      - name: Summarize native and fallback results
        if: always()
        run: python3 .github/workflows/util/iceberg-upstream/summarize.py iceberg-reports
      - name: Verify failures against vanilla Spark
        working-directory: ${{ steps.checkout.outputs.directory }}
        run: |
          scripts="$GITHUB_WORKSPACE/.github/workflows/util/iceberg-upstream"
          reports="$GITHUB_WORKSPACE/iceberg-reports"
          python3 "$scripts/control.py" "$reports" --select "$reports/vanilla-selection.txt"
          selection=$(cat "$reports/vanilla-selection.txt")
          if [ -n "$selection" ]; then
            $MVN_CMD surefire:test@iceberg-upstream -pl backends-velox $ICEBERG_PROFILES \
              -Diceberg.upstream.shard="$ICEBERG_SHARD" -Diceberg.upstream.shards="$ICEBERG_SHARD_COUNT" \
              "-Dtest=$selection" -Dspark.plugins= -Dmaven.test.failure.ignore=true \
              -Diceberg.upstream.reports="$reports/vanilla"
          fi
          python3 "$scripts/control.py" "$reports" --vanilla "$reports/vanilla"
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iceberg-upstream-spark3.5-${{ matrix.revision }}-shard${{ matrix.shard }}
          path: iceberg-reports/
          if-no-files-found: error
          retention-days: 1

  iceberg-upstream-gate:
    name: iceberg-upstream-gate (3.5)
    needs: [prepare, iceberg-upstream-test]
    if: always() && !cancelled() && needs.prepare.result != 'skipped'
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Require complete test runs
        env:
          UPSTREAM_RESULT: ${{ needs.iceberg-upstream-test.result }}
        run: test "$UPSTREAM_RESULT" = success
      - name: Download base shards
        if: always()
        uses: actions/download-artifact@v8
        with:
          pattern: iceberg-upstream-spark3.5-base-shard*
          path: iceberg-base
      - name: Download current shards
        if: always()
        uses: actions/download-artifact@v8
        with:
          pattern: iceberg-upstream-spark3.5-head-shard*
          path: iceberg-head
      - name: Merge every base shard
        id: base
        if: always()
        run: python3 .github/workflows/util/iceberg-upstream/merge.py iceberg-base --shards "$ICEBERG_SHARD_COUNT"
      - name: Merge every current shard
        id: head
        if: always()
        run: python3 .github/workflows/util/iceberg-upstream/merge.py iceberg-head --shards "$ICEBERG_SHARD_COUNT"
      - name: Reject Iceberg regressions
        if: always() && steps.base.outcome == 'success' && steps.head.outcome == 'success'
        run: >-
          python3 .github/workflows/util/iceberg-upstream/compare.py
          iceberg-base/execution-coverage.json iceberg-head/execution-coverage.json
          --output iceberg-comparison.json
      - name: Upload complete coverage and changes
        id: reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iceberg-upstream-spark3.5-reports
          path: |
            iceberg-base/
            iceberg-head/
            iceberg-comparison.json
            iceberg-comparison.csv
          if-no-files-found: error
      - name: Link downloadable CSVs
        if: always() && steps.reports.outputs.artifact-url != ''
        env:
          REPORT_URL: ${{ steps.reports.outputs.artifact-url }}
        run: |
          echo "[Download complete native, fallback, failed and changes-only CSVs]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
