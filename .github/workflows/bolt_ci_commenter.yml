name: Bolt CI Commenter

on:
  workflow_run:
    workflows: [Bolt Backend Build (x86), 'Bolt CI PR *']
    types: [in_progress, completed]

permissions: {}

env:
  CONTROL_SHA: ${{ github.workflow_sha }}

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      pr: ${{ steps.route.outputs.pr }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/workflows/util/bolt-ci
      - id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/workflows/util/bolt-ci/control.py route

  report:
    needs: route
    if: needs.route.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: bolt-control-pr-${{ needs.route.outputs.pr }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/workflows/util/bolt-ci
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/workflows/util/bolt-ci/control.py report
