name: Velox x86 tests

on:
  workflow_call:
    inputs:
      changes:
        required: true
        type: string

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  MVN_CMD: 'build/mvn -ntp'
  WGET_CMD: 'wget -nv'
  CCACHE_DIR: '${{ github.workspace }}/.ccache'
  SPARK_ANSI_SQL_MODE: false

# Integration tests run independently of JVM unit tests. Matrix caps include
# overlapping producer, consumer and auxiliary jobs.
# Retain upstream's default job timeout so cold builds and SF30 generation finish.
# Warm-cache performance targets are measured separately from cancellation limits.
jobs:
  build-tpc-default:
    if: >-
      fromJSON(inputs.changes).cpp == 'true' ||
      fromJSON(inputs.changes).java == 'true' ||
      fromJSON(inputs.changes).tools_it == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ "ubuntu:22.04" ]
        spark: [ "spark-3.4", "spark-3.5", "spark-4.0", "spark-4.1"  ]
        # PR runs test the primary JDK per Spark line (8 for 3.x, 17 for 4.x --
        # after the static excludes below that is 4 combos instead of 8). The
        # alternative-JDK combos (11/21/25) validate build + TPC run under JDKs
        # that Gluten changes rarely break in a JDK-specific way; the nightly
        # full_run keeps covering them daily so a break surfaces within a day
        # instead of costing ~75 runner-minutes on every PR.
        java: >-
          ${{ fromJSON(fromJSON(inputs.changes).full_run == 'true'
          && '["java-8", "java-11", "java-17", "java-21", "java-25"]'
          || '["java-8", "java-17"]') }}
        # Spark supports JDK17 since 3.3.
        exclude:
          - spark: spark-3.4
            java: java-25
          - spark: spark-3.5
            java: java-25
          - spark: spark-3.4
            java: java-21
          - spark: spark-3.5
            java: java-21
          - spark: spark-3.4
            java: java-17
          - spark: spark-3.5
            java: java-17
          - spark: spark-3.4
            java: java-11
          - spark: spark-4.0
            java: java-8
          - spark: spark-4.0
            java: java-11
          - spark: spark-4.1
            java: java-8
          - spark: spark-4.1
            java: java-11

    runs-on: ubuntu-22.04
    container: ${{ matrix.java == 'java-8' && 'apache/gluten:centos-8-jdk8' || matrix.java == 'java-11' && 'apache/gluten:centos-8-jdk11' || matrix.java == 'java-17' && 'apache/gluten:centos-9-jdk17' || 'apache/gluten:ubuntu22-m2-cache' }}
    env:
      TPC_SPARK: ${{ matrix.spark }}
      TPC_JAVA: ${{ matrix.java }}
      TPC_SHUFFLE: plain
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: velox-native-lib-centos-8-${{ github.sha }}
          path: cpp/build/releases/
      - name: Select the build JDK
        shell: bash
        run: |
          case "$TPC_JAVA" in
            java-8) java_home=/usr/lib/jvm/java-1.8.0-openjdk ;;
            java-11) java_home=/usr/lib/jvm/java-11-openjdk ;;
            java-17) java_home=/usr/lib/jvm/java-17-openjdk ;;
            java-21|java-25)
              apt-get update
              apt-get install -y "openjdk-${TPC_JAVA#java-}-jdk"
              java_home="/usr/lib/jvm/$TPC_JAVA-openjdk-amd64" ;;
          esac
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          echo "PATH=$java_home/bin:$PATH" >> "$GITHUB_ENV"
      - name: Build one integration runtime for every matching consumer
        shell: bash
        run: |
          scala=""
          case "$TPC_SPARK" in spark-4.*) scala=-Pscala-2.13 ;; esac
          shuffle=""; tools_shuffle=""
          case "$TPC_SHUFFLE" in
            celeborn-0.5.4) shuffle=-Pceleborn; tools_shuffle=-Pceleborn,celeborn-0.5 ;;
            celeborn-0.6.3) shuffle=-Pceleborn; tools_shuffle=-Pceleborn,celeborn-0.6 ;;
          esac
          # Downstream reactor modules require Gluten's test jars even when no
          # tests execute here. Compile/package them without running the suites.
          build/mvn -ntp clean install -Pbackends-velox,fast-build -P"$TPC_SPARK" -P"$TPC_JAVA" $scala $shuffle -DskipTests
          (cd tools/gluten-it && "$GITHUB_WORKSPACE/build/mvn" -ntp clean install -P"$TPC_SPARK" -P"$TPC_JAVA" $tools_shuffle)
          python3 .github/workflows/util/tpc-build.py pack --archive "$RUNNER_TEMP/runtime.zip" \
            --spark "$TPC_SPARK" --java "$TPC_JAVA" --shuffle "$TPC_SHUFFLE"
      - uses: actions/upload-artifact@v7
        with:
          name: tpc-build-${{ env.TPC_SPARK }}-${{ env.TPC_JAVA }}-${{ env.TPC_SHUFFLE }}
          path: ${{ runner.temp }}/runtime.zip
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  build-tpc-celeborn:
    if: >-
      fromJSON(inputs.changes).cpp == 'true' ||
      fromJSON(inputs.changes).java == 'true' ||
      fromJSON(inputs.changes).tools_it == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        spark: [ "spark-3.5" ]
        # Both shuffle writers stay per-PR (they exercise different Gluten
        # writer code paths); the older Celeborn release is client-compat
        # coverage that the nightly full_run re-checks daily instead of every
        # PR paying for both versions.
        celeborn: >-
          ${{ fromJSON(fromJSON(inputs.changes).full_run == 'true'
          && '["celeborn-0.6.3", "celeborn-0.5.4"]'
          || '["celeborn-0.6.3"]') }}
    runs-on: ubuntu-22.04
    container: apache/gluten:centos-8-jdk8
    env:
      TPC_SPARK: ${{ matrix.spark }}
      TPC_JAVA: java-8
      TPC_SHUFFLE: ${{ matrix.celeborn }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: velox-native-lib-centos-8-${{ github.sha }}
          path: cpp/build/releases/
      - name: Select the build JDK
        shell: bash
        run: |
          case "$TPC_JAVA" in
            java-8) java_home=/usr/lib/jvm/java-1.8.0-openjdk ;;
            java-11) java_home=/usr/lib/jvm/java-11-openjdk ;;
            java-17) java_home=/usr/lib/jvm/java-17-openjdk ;;
            java-21|java-25)
              apt-get update
              apt-get install -y "openjdk-${TPC_JAVA#java-}-jdk"
              java_home="/usr/lib/jvm/$TPC_JAVA-openjdk-amd64" ;;
          esac
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          echo "PATH=$java_home/bin:$PATH" >> "$GITHUB_ENV"
      - name: Build one integration runtime for every matching consumer
        shell: bash
        run: |
          scala=""
          case "$TPC_SPARK" in spark-4.*) scala=-Pscala-2.13 ;; esac
          shuffle=""; tools_shuffle=""
          case "$TPC_SHUFFLE" in
            celeborn-0.5.4) shuffle=-Pceleborn; tools_shuffle=-Pceleborn,celeborn-0.5 ;;
            celeborn-0.6.3) shuffle=-Pceleborn; tools_shuffle=-Pceleborn,celeborn-0.6 ;;
          esac
          # Downstream reactor modules require Gluten's test jars even when no
          # tests execute here. Compile/package them without running the suites.
          build/mvn -ntp clean install -Pbackends-velox,fast-build -P"$TPC_SPARK" -P"$TPC_JAVA" $scala $shuffle -DskipTests
          (cd tools/gluten-it && "$GITHUB_WORKSPACE/build/mvn" -ntp clean install -P"$TPC_SPARK" -P"$TPC_JAVA" $tools_shuffle)
          python3 .github/workflows/util/tpc-build.py pack --archive "$RUNNER_TEMP/runtime.zip" \
            --spark "$TPC_SPARK" --java "$TPC_JAVA" --shuffle "$TPC_SHUFFLE"
      - uses: actions/upload-artifact@v7
        with:
          name: tpc-build-${{ env.TPC_SPARK }}-${{ env.TPC_JAVA }}-${{ env.TPC_SHUFFLE }}
          path: ${{ runner.temp }}/runtime.zip
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  tpc-test-ubuntu:
    needs: build-tpc-default
    if: >-
      fromJSON(inputs.changes).cpp == 'true' ||
      fromJSON(inputs.changes).java == 'true' ||
      fromJSON(inputs.changes).tools_it == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ "ubuntu:22.04" ]
        spark: [ "spark-3.4", "spark-3.5", "spark-4.0", "spark-4.1"  ]
        # PR runs test the primary JDK per Spark line (8 for 3.x, 17 for 4.x --
        # after the static excludes below that is 4 combos instead of 8). The
        # alternative-JDK combos (11/21/25) validate build + TPC run under JDKs
        # that Gluten changes rarely break in a JDK-specific way; the nightly
        # full_run keeps covering them daily so a break surfaces within a day
        # instead of costing ~75 runner-minutes on every PR.
        java: >-
          ${{ fromJSON(fromJSON(inputs.changes).full_run == 'true'
          && '["java-8", "java-11", "java-17", "java-21", "java-25"]'
          || '["java-8", "java-17"]') }}
        # Spark supports JDK17 since 3.3.
        exclude:
          - spark: spark-3.4
            java: java-25
          - spark: spark-3.5
            java: java-25
          - spark: spark-3.4
            java: java-21
          - spark: spark-3.5
            java: java-21
          - spark: spark-3.4
            java: java-17
          - spark: spark-3.5
            java: java-17
          - spark: spark-3.4
            java: java-11
          - spark: spark-4.0
            java: java-8
          - spark: spark-4.0
            java: java-11
          - spark: spark-4.1
            java: java-8
          - spark: spark-4.1
            java: java-11

    runs-on: ubuntu-22.04
    container: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Download the matching integration runtime
        uses: actions/download-artifact@v8
        with:
          name: tpc-build-${{ matrix.spark }}-${{ matrix.java }}-plain
          path: ${{ runner.temp }}/tpc-build
      - name: Setup tzdata
        run: |
          sed -i 's|http://archive|http://eu.archive|g' /etc/apt/sources.list
          if [ "${{ matrix.os }}" = "ubuntu:22.04" ]; then
            apt-get update
            TZ="Etc/GMT" DEBIAN_FRONTEND=noninteractive apt-get install -y tzdata
          fi
      - name: Setup java
        run: |
          if [ "${{ matrix.java }}" = "java-17" ]; then
            apt-get update && apt-get install -y openjdk-17-jdk wget python3
            apt remove openjdk-11* -y
          elif [ "${{ matrix.java }}" = "java-25" ]; then
            apt-get update && apt-get install -y openjdk-25-jdk wget python3
          elif [ "${{ matrix.java }}" = "java-21" ]; then
            apt-get update && apt-get install -y openjdk-21-jdk wget python3
          elif [ "${{ matrix.java }}" = "java-11" ]; then
            apt-get update && apt-get install -y openjdk-11-jdk wget python3
          else
            apt-get update && apt-get install -y openjdk-8-jdk wget python3
            apt remove openjdk-11* -y
          fi
      - name: Install Hadoop & Setup HDFS
        if: matrix.os == 'ubuntu:22.04' && matrix.spark == 'spark-3.5' && matrix.java == 'java-8'
        shell: bash
        run: |
          export JAVA_HOME=/usr/lib/jvm/${{ matrix.java }}-openjdk-amd64
          source .github/workflows/util/install-spark-deps.sh
          install_hadoop
          setup_hdfs
      - name: Install MinIO
        if: matrix.os == 'ubuntu:22.04' && matrix.spark == 'spark-3.5' && matrix.java == 'java-8'
        shell: bash
        run: |
          export JAVA_HOME=/usr/lib/jvm/${{ matrix.java }}-openjdk-amd64
          source .github/workflows/util/install-spark-deps.sh
          install_minio
      - name: Restore and run TPC-H / TPC-DS
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/
          export JAVA_HOME=/usr/lib/jvm/${{ matrix.java }}-openjdk-amd64
          echo "JAVA_HOME: $JAVA_HOME"
          python3 "$GITHUB_WORKSPACE/.github/workflows/util/tpc-build.py" restore \
            --revision "$GITHUB_SHA" \
            --archive "$RUNNER_TEMP/tpc-build/runtime.zip" --spark "${{ matrix.spark }}" \
            --java "${{ matrix.java }}" --shuffle "plain"
          cd "$GITHUB_WORKSPACE/tools/gluten-it"
          # Setup S3 JARs after restoring gluten-it
          if [ "${{ matrix.os }}" = "ubuntu:22.04" ] && \
            [ "${{ matrix.spark }}" = "spark-3.5" ] && \
            [ "${{ matrix.java }}" = "java-8" ]; then
            source $GITHUB_WORKSPACE/.github/workflows/util/install-spark-deps.sh
            SPARK_VERSION=$(echo "${{ matrix.spark }}" | sed 's/spark-//')
            setup_minio "$SPARK_VERSION"
          fi
          GLUTEN_IT_JVM_ARGS=-Xmx5G sbin/gluten-it.sh queries-compare \
            --local --preset=velox --benchmark-type=h --error-on-memleak --off-heap-size=10g -s=1.0 --threads=16 --iterations=1 \
          && GLUTEN_IT_JVM_ARGS=-Xmx6G sbin/gluten-it.sh queries-compare \
            --local --preset=velox --benchmark-type=ds --error-on-memleak --off-heap-size=10g -s=1.0 --threads=16 --iterations=1
          if [ "${{ matrix.os }}" = "ubuntu:22.04" ] && \
            [ "${{ matrix.spark }}" = "spark-3.5" ] && \
            [ "${{ matrix.java }}" = "java-8" ]; then
            GLUTEN_IT_JVM_ARGS=-Xmx6G sbin/gluten-it.sh queries-compare \
            --local --preset=velox --benchmark-type=h --error-on-memleak --off-heap-size=10g -s=1.0 --threads=16 --iterations=1 \
            --queries=q1 --data-dir="hdfs://localhost:9000/test"
            GLUTEN_IT_JVM_ARGS=-Xmx6G sbin/gluten-it.sh queries-compare \
            --local --preset=velox --benchmark-type=h --error-on-memleak --off-heap-size=10g -s=1.0 --threads=16 --iterations=1 \
            --queries=q1 --data-dir="s3a://gluten-it/test" \
            --extra-conf=spark.hadoop.fs.s3a.endpoint=http://localhost:9100 \
            --extra-conf=spark.hadoop.fs.s3a.access.key=admin \
            --extra-conf=spark.hadoop.fs.s3a.secret.key=admin123 \
            --extra-conf=spark.hadoop.fs.s3a.path.style.access=true \
            --extra-conf=spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
          fi

  tpc-test-centos8:
    needs: build-tpc-default
    if: >-
      fromJSON(inputs.changes).cpp == 'true' ||
      fromJSON(inputs.changes).java == 'true' ||
      fromJSON(inputs.changes).tools_it == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      # This job's per-PR value is OS compatibility of the same native lib and
      # TPC run that tpc-test-ubuntu already exercises combo-by-combo, so PRs
      # test one representative combo per Spark line ({3.5, 4.1} x primary JDK
      # = 2 jobs after the excludes below) and the nightly full_run restores
      # the whole 5-combo fan-out.
      matrix:
        os: [ "centos:8" ]
        spark: >-
          ${{ fromJSON(fromJSON(inputs.changes).full_run == 'true'
          && '["spark-3.4", "spark-3.5", "spark-4.0", "spark-4.1"]'
          || '["spark-3.5", "spark-4.1"]') }}
        java: >-
          ${{ fromJSON(fromJSON(inputs.changes).full_run == 'true'
          && '["java-8", "java-11", "java-17"]'
          || '["java-8", "java-17"]') }}
        # Spark supports JDK17 since 3.3.
        exclude:
          - spark: spark-3.4
            java: java-17
          - spark: spark-3.5
            java: java-17
          - spark: spark-3.4
            java: java-11
          - spark: spark-4.0
            java: java-8
          - spark: spark-4.0
            java: java-11
          - spark: spark-4.1
            java: java-8
          - spark: spark-4.1
            java: java-11

    runs-on: ubuntu-22.04
    container: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Download the matching integration runtime
        uses: actions/download-artifact@v8
        with:
          name: tpc-build-${{ matrix.spark }}-${{ matrix.java }}-plain
          path: ${{ runner.temp }}/tpc-build
      - name: Update mirror list
        run: |
          if [ "${{ matrix.os }}" = "centos:7" ] || [ "${{ matrix.os }}" = "centos:8" ]; then
            sed -i -e "s|mirrorlist=|#mirrorlist=|g" /etc/yum.repos.d/CentOS-* || true
            sed -i -e "s|#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g" /etc/yum.repos.d/CentOS-* || true
          fi
      - name: Setup java
        run: |
          if [ "${{ matrix.java }}" = "java-17" ]; then
            yum update -y && yum install -y java-17-openjdk-devel wget python3
          elif [ "${{ matrix.java }}" = "java-11" ]; then
            yum update -y && yum install -y java-11-openjdk-devel wget python3
          else
            yum update -y && yum install -y java-1.8.0-openjdk-devel wget python3
          fi
      - name: Set environment variables
        run: |
          if [ "${{ matrix.java }}" = "java-17" ]; then
            echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk" >> $GITHUB_ENV
          elif [ "${{ matrix.java }}" = "java-11" ]; then
            echo "JAVA_HOME=/usr/lib/jvm/java-11-openjdk" >> $GITHUB_ENV
          else
            echo "JAVA_HOME=/usr/lib/jvm/java-1.8.0-openjdk" >> $GITHUB_ENV
          fi
      - name: Restore gluten-it
        run: |
          python3 "$GITHUB_WORKSPACE/.github/workflows/util/tpc-build.py" restore \
            --revision "$GITHUB_SHA" \
            --archive "$RUNNER_TEMP/tpc-build/runtime.zip" --spark "${{ matrix.spark }}" \
            --java "${{ matrix.java }}" --shuffle "plain"
      - name: Run TPC-H / TPC-DS
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          cd $GITHUB_WORKSPACE/tools/gluten-it
          GLUTEN_IT_JVM_ARGS=-Xmx5G sbin/gluten-it.sh queries-compare \
            --local --preset=velox --benchmark-type=h --error-on-memleak --off-heap-size=10g -s=1.0 --threads=16 --iterations=1
          GLUTEN_IT_JVM_ARGS=-Xmx6G sbin/gluten-it.sh queries-compare \
            --local --preset=velox --benchmark-type=ds --error-on-memleak --off-heap-size=10g -s=1.0 --threads=16 --iterations=1

  tpc-test-ubuntu-oom:
    # Chaos/stress tier: this job probes native memory-pressure behaviour, so
    # per-PR it only runs when native code changed (cpp=true). For java-only
    # changes its ~60 runner-minutes rarely produce PR-specific signal; the
    # nightly full_run still exercises it daily.
    needs: build-tpc-default
    if: >-
      fromJSON(inputs.changes).full_run == 'true' ||
      fromJSON(inputs.changes).cpp == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        spark: [ "spark-3.5" ]
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize build disk space
        shell: bash
        run: |
          df -h
          set -euo pipefail
          echo "Removing unwanted software... "
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h
      - uses: actions/checkout@v7
      - name: Download the matching integration runtime
        uses: actions/download-artifact@v8
        with:
          name: tpc-build-${{ matrix.spark }}-java-8-plain
          path: ${{ runner.temp }}/tpc-build
      - name: Setup java
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-8-jdk wget python3
      - name: Set environment variables
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64" >> $GITHUB_ENV
      - name: Restore the vanilla Spark SF30 fixture
        id: tpcds-data
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/tpcds-generated-30.0-parquet-non_partitioned
            /tmp/tpcds-generated-30.0-parquet-non_partitioned.completed
          key: tpcds-sf30-parquet-v1-${{ runner.arch }}-${{ hashFiles('pom.xml', 'tools/gluten-it/pom.xml', 'tools/gluten-it/**/pom.xml', 'tools/gluten-it/common/src/main/**', 'tools/gluten-it/3rd/**/src/**') }}
      - name: Restore runtime and generate missing fixture for Spark ${{ matrix.spark }}
        run: |
          cd $GITHUB_WORKSPACE/
          python3 "$GITHUB_WORKSPACE/.github/workflows/util/tpc-build.py" restore \
            --revision "$GITHUB_SHA" \
            --archive "$RUNNER_TEMP/tpc-build/runtime.zip" --spark "${{ matrix.spark }}" \
            --java "java-8" --shuffle "plain"
          cd "$GITHUB_WORKSPACE/tools/gluten-it"
          GLUTEN_IT_JVM_ARGS=-Xmx6G sbin/gluten-it.sh data-gen-only --local --benchmark-type=ds -s=30.0 --threads=12
      - name: Save the complete generated fixture
        if: steps.tpcds-data.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/tpcds-generated-30.0-parquet-non_partitioned
            /tmp/tpcds-generated-30.0-parquet-non_partitioned.completed
          key: ${{ steps.tpcds-data.outputs.cache-primary-key }}
      - name: TPC-DS SF30.0 Parquet local spark3.5 Q67/Q95 low memory, memory isolation off
        run: |
          cd tools/gluten-it \
          && GLUTEN_IT_JVM_ARGS=-Xmx3G sbin/gluten-it.sh parameterized \
            --local --preset=velox --benchmark-type=ds --error-on-memleak --queries=q67,q95 -s=30.0 --threads=12 --shuffle-partitions=72 --iterations=1 \
            --data-gen=skip -m=OffHeapExecutionMemory \
            -d=ISOLATION:OFF,spark.gluten.memory.isolation=false \
            -d=OFFHEAP_SIZE:6g,spark.memory.offHeap.size=6g \
            -d=OFFHEAP_SIZE:4g,spark.memory.offHeap.size=4g \
            -d=OVER_ACQUIRE:0.3,spark.gluten.memory.overAcquiredMemoryRatio=0.3 \
            -d=OVER_ACQUIRE:0.5,spark.gluten.memory.overAcquiredMemoryRatio=0.5 \
            --excluded-dims=OFFHEAP_SIZE:4g
      - name: TPC-DS SF30.0 Parquet local spark3.5 Q67 low memory, memory isolation on
        run: |
          cd tools/gluten-it \
          && GLUTEN_IT_JVM_ARGS=-Xmx3G sbin/gluten-it.sh parameterized \
            --local --preset=velox --benchmark-type=ds --error-on-memleak --queries=q67 -s=30.0 --threads=12 --shuffle-partitions=72 --iterations=1 \
            --data-gen=skip -m=OffHeapExecutionMemory \
