syntax = "proto3";

package gluten;

option java_package = "org.apache.gluten.proto";
option java_multiple_files = true;

message IcebergSortingColumn {
  string column_name = 1;
  bool ascending = 2;
  bool nulls_first = 3;
}

message IcebergSortingColumnList {
  repeated IcebergSortingColumn fields = 1;
}